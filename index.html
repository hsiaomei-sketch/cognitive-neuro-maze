<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>認知神經迷路闖關</title><style>body{margin:0;background:#eaf6f3;color:#163047;font:17px system-ui}header{text-align:center;padding:35px 15px 65px;background:#b8e6f8}h1{margin:0;font-size:clamp(2rem,5vw,3rem)}main{max-width:1050px;margin:-28px auto 35px;padding:0 14px}.box{background:#fffefa;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #31546620}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note,.card{background:#f3fcff;border:2px solid #c4e5ef;border-radius:15px;padding:14px}.map{overflow:auto;background:#b9e5f5;border-radius:15px;padding:8px}svg{display:block;min-width:700px;width:100%}.w{fill:none;stroke:#182e3d;stroke-width:8}.n{fill:#e92735;font-weight:900;font-size:23px;text-anchor:middle}.g{font-size:34px;text-anchor:middle}.star{font-size:48px;fill:#e92735;text-anchor:middle}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.pad button,.btn{border:0;border-radius:10px;background:#258bbe;color:#fff;font:inherit;font-weight:900;padding:9px}.pad button{font-size:1.7rem}.pad button:disabled{opacity:.4}.time{font-size:2rem;color:#c52e3b;font-weight:900}.msg{background:#fff5d4;padding:10px;border-radius:10px;min-height:50px;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.chip{padding:4px 7px;border:2px solid #b9d7e3;border-radius:8px;font-weight:900}.chip.ok{background:#4b9b60;color:white}input,select{box-sizing:border-box;width:100%;padding:9px;margin-top:4px;border:2px solid #9ecadd;border-radius:9px;font:inherit}.score{background:#173047;color:white;border-radius:13px;padding:13px}.score b{color:#ffdc67;font-size:1.7rem;display:block}.alt{background:#fff!important;color:#176c96!important;border:2px solid #72b1cd!important}@media(max-width:700px){.two{grid-template-columns:1fr}}</style><header><h1>認知神經迷路闖關</h1><b>A、B 組各 30 人｜依 1 → 12 畫 12 個方向箭頭，走到出口</b></header><main><section class="box two"><div><h2>活動規則</h2><ol><li>A、B 組各 30 人；同組走固定路線。</li><li>每位學生從 ⭐ 出發，依序 1～12，完成 12 個箭頭後到出口。</li><li>組別成績＝30 人秒數總和 ÷ 30。</li></ol></div><div class=note><b>教師提醒</b><p>這不是接力；每位學生都要完整完成一次。每組第 30 人完成後，系統不再加入成績。</p></div></section><section class=box><h2>雙組田字型地圖</h2><div class=map><svg id=map viewBox="0 0 1200 475"></svg></div></section><section class="box two"><div class=card><label>組別<select id=team><option value=A>A組</option><option value=B>B組</option></select></label><label>姓名／座號<input id=student placeholder="例如：王小明／12"></label><div id=clock class=time>00:00.0</div><div id=msg class=msg>輸入姓名後，按「開始計時」。</div><div class=pad><button data-d=↑ disabled>↑</button><button data-d=↓ disabled>↓</button><button data-d=← disabled>←</button><button data-d=→ disabled>→</button></div><div id=steps class=chips></div><button id=go class=btn>開始計時</button> <button id=again class="btn alt">重新本次</button></div><div class=card><h2>組別成績</h2><div class="two"><div class=score>A組<b id=aa>—</b><small id=ac>0 / 30 位完成</small><div id=al></div></div><div class=score>B組<b id=ba>—</b><small id=bc>0 / 30 位完成</small><div id=bl></div></div></div><button id=wipe class="btn alt" style="margin-top:10px">教師：清除本機成績</button></div></section></main><script>const E=x=>document.getElementById(x),P={A:['→','↓','→','↑','←','↓','←','↓','→','↑','→','↓'],B:['←','↓','←','↑','→','↓','→','↓','←','↑','←','↓']};let S={on:0,g:'A',i:0,t:0,e:0},D=()=>JSON.parse(localStorage.mazeScores||'[]'),save=x=>localStorage.mazeScores=JSON.stringify(x),f=x=>String(x/60000|0).padStart(2,'0')+':'+((x%60000)/1000).toFixed(1).padStart(4,'0');let ns=[[210,118],[268,212],[392,252],[455,212],[397,118],[325,212],[210,252],[140,324],[210,376],[270,324],[400,278],[452,324]];function draw(){let t='<text class=g x=290 y=45>A組</text><text class=g x=910 y=45>B組</text><text class=star x=65 y=155>★</text><text class=star x=1135 y=155>★</text><path class=w d="M100 135H480V400H100ZM290 135V400M100 268H480M720 135H1100V400H720ZM910 135V400M720 268H1100"/>';for(let g of ['A','B'])ns.forEach((p,i)=>{let x=g=='A'?p[0]:1200-p[0];t+='<text class=n x='+x+' y='+p[1]+'>'+ (i+1)+'</text>'});t+='<path fill=#e92735 d="M448 420h40l-20 33zM712 420h40l-20 33z"/><text x=600 y=470 fill=white font-size=24 font-weight=900 text-anchor=middle>畫出路線，走到出口</text>';E('map').innerHTML=t}function chips(){E('steps').innerHTML=P[S.g].map((x,i)=>'<span class="chip '+(i<S.i?'ok':'')+'">'+(i+1)+(i<S.i?' '+x:'')+'</span>').join('')}function board(){for(let g of ['A','B']){let a=D().filter(x=>x.g==g),v=a.length?a.reduce((s,x)=>s+x.t,0)/a.length:0,k=g.toLowerCase();E(k+'a').textContent=a.length?(v/1000).toFixed(1)+' 秒':'—';E(k+'c').textContent=a.length+' / 30 位完成';E(k+'l').textContent=a.slice(-6).map(x=>x.n+' '+(x.t/1000).toFixed(1)+'秒').join('｜')}}function tick(){if(S.on){S.e=Date.now()-S.t;E('clock').textContent=f(S.e);requestAnimationFrame(tick)}}function reset(){S={on:0,g:E('team').value,i:0,t:0,e:0};E('clock').textContent='00:00.0';E('msg').textContent='輸入姓名後，按「開始計時」。';document.querySelectorAll('[data-d]').forEach(x=>x.disabled=1);chips()}E('go').onclick=()=>{let n=E('student').value.trim(),g=E('team').value;if(!n){E('msg').textContent='請先輸入姓名或座號。';E('student').focus();return}if(D().filter(x=>x.g==g).length>=30){E('msg').textContent=g+'組已完成 30 人，請改選另一組。';return}S.g=g;S.on=1;S.t=Date.now();E('msg').textContent=g+'組：第 1 個箭頭，從 ⭐ 前往數字 1。';document.querySelectorAll('[data-d]').forEach(x=>x.disabled=0);chips();tick()};document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{if(!S.on)return;if(x.dataset.d!=P[S.g][S.i])return E('msg').textContent='再想一想，請依地圖從 '+S.i+' 前往 '+(S.i+1)+'。';S.i++;if(S.i==12){S.on=0;let a=D();a.push({g:S.g,n:E('student').value.trim(),t:S.e});save(a);E('msg').textContent='完成！本次 '+f(S.e)+' 已記入 '+S.g+'組。';document.querySelectorAll('[data-d]').forEach(x=>x.disabled=1);board()}else E('msg').textContent='答對！第 '+(S.i+1)+' 個箭頭。';chips()});E('again').onclick=reset;E('team').onchange=reset;E('wipe').onclick=()=>{if(confirm('清除本機所有成績？')){save([]);board()}};draw();reset();board();</script>
