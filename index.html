<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>雙組箭頭迷宮</title><style>body{font:18px system-ui;margin:0;background:#e8f8ff;color:#163047}header{text-align:center;padding:28px;background:#aee3f8}main{max-width:850px;margin:auto;padding:18px}.box{background:white;border-radius:16px;padding:18px;margin:14px 0}.maze{font-size:30px;letter-spacing:9px;text-align:center;padding:25px;border:6px solid #183445}.pad button{font-size:28px;margin:5px;padding:8px 16px}.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score div{background:#eef9fc;padding:10px;border-radius:10px}</style><header><h1>雙組 12 箭頭迷宮競賽</h1><b>A、B 組各走固定路徑；個人完成秒數平均即為組別得分</b></header><main><section class=box><p>每位學生選擇組別、輸入姓名後開始。依序經過 1～12，按下正確方向箭頭才能前進；錯誤箭頭不前進。</p><label>組別 <select id=g><option>A</option><option>B</option></select></label>　<label>姓名 <input id=name placeholder="請輸入姓名"></label> <button id=start>開始</button></section><section class=box><div class=maze>⭐ 1　2　3<br>12　田　4<br>11　6　5<br>△　10　9　8　7</div><h2 id=step>請開始</h2><p id=hint>依序通過 1～12，完成 12 個方向箭頭。</p><div class=pad><button data=d=↑>↑</button><br><button data=d=←>←</button><button data=d=↓>↓</button><button data=d=→>→</button></div><p>時間：<b id=time>00:00.0</b></p></section><section class="box score"><div id=A>A 組：尚無成績</div><div id=B>B 組：尚無成績</div></section><button id=clear>清除本機成績</button></main><script>const path={A:['→','→','↓','↓','←','←','↓','→','→','↓','←','←'],B:['↓','↓','→','→','↑','↑','→','↓','↓','←','←','↓']};let s=0,t=0,team='A',run=0;let data=JSON.parse(localStorage.mscore||'[]');function f(x){return String(x/60000|0).padStart(2,'0')+':'+((x%60000)/1000).toFixed(1).padStart(4,'0')}function board(){['A','B'].forEach(k=>{let a=data.filter(x=>x.g==k),v=a.length?a.reduce((z,x)=>z+x.t,0)/a.length:0;document.querySelector('#'+k).innerHTML='<b>'+k+' 組</b><br>人數：'+a.length+'<br>平均：'+(a.length?f(v):'尚無成績')+'<br>'+a.map(x=>x.n+' '+f(x.t)).join('<br>')})}function tick(){if(run){time.textContent=f(Date.now()-t);requestAnimationFrame(tick)}}start.onclick=()=>{team=g.value;s=0;t=Date.now();run=1;step.textContent=team+' 組：第 1 步 / 12';hint.textContent='請按 '+path[team][0];tick()};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!run)return;if(b.dataset.d==path[team][s]){s++;if(s==12){run=0;let z=Date.now()-t;data.push({g:team,n:name.value||'未具名',t:z});localStorage.mscore=JSON.stringify(data);step.textContent='完成！ '+f(z);hint.textContent='已納入 '+team+' 組平均成績';board()}else{step.textContent=team+' 組：第 '+(s+1)+' 步 / 12';hint.textContent='下一步：請按 '+path[team][s]}}else hint.textContent='這不是正確方向，請再想一下。'});clear.onclick=()=>{localStorage.removeItem('mscore');data=[];board()};board();</script>
