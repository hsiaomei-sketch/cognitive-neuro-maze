<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>田字型數字連線迷宮</title><style>body{margin:0;background:#e5f7ff;color:#173047;font:17px system-ui,"PingFang TC"}header{text-align:center;padding:30px;background:#aee4f8}h1{margin:0}main{max-width:950px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #0002}.row{display:grid;grid-template-columns:2fr 1fr;gap:18px}canvas{width:100%;touch-action:none;background:#e9faff;border-radius:14px}.n{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.n button{padding:7px;border:2px solid #a9cad7;background:#fff;border-radius:8px;font-weight:bold}.n .ok{background:#70b65e;color:white}.n .now{background:#ffd55a}.next,.msg{padding:10px;border-radius:10px;font-weight:bold}.next{background:#fff1bb}.msg{background:#fff7d9;margin:10px 0}button{padding:8px;border:0;border-radius:8px;background:#2687b5;color:white;font-weight:bold}@media(max-width:700px){.row{grid-template-columns:1fr}}</style><header><h1>田字型數字連線迷宮</h1><b>30 人接力版：依 1 → 30 順序畫線</b></header><main><section class=card><h2>玩法</h2><p>每位同學拿一個號碼。1 號從 ⭐ 拖到 1；第 2 號起，從前一點拖到自己的數字。不可跳號，30 號完成後抵達 △ 出口。</p><p>訓練：注意力、工作記憶、空間路徑規劃與合作。</p></section><section class=card><div id=count>已完成 0 / 30</div><div class=next id=next>請 1 號：從 ⭐ 拖到 1</div><div class=row><canvas id=c width=600 height=560></canvas><div><h3>輪到誰？</h3><div class=n id=n></div><div class=msg id=m>請 1 號開始。</div><button id=u>回復上一段</button> <button id=r>重新開始</button></div></div><h2 id=win hidden>🎉 全組成功走出迷宮！</h2></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),P=[[90,80],[160,80],[230,80],[230,145],[160,145],[90,145],[90,220],[160,220],[230,220],[230,315],[160,315],[90,315],[90,390],[160,390],[230,390],[230,475],[160,475],[90,475],[350,475],[420,475],[490,475],[490,390],[420,390],[350,390],[350,315],[420,315],[490,315],[490,220],[420,220],[350,220]],S=[50,80],E=[545,220],q={i:0,on:0,p:0};let d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);function draw(){x.clearRect(0,0,600,560);x.strokeStyle='#173047';x.lineWidth=8;x.strokeRect(50,40,480,480);x.beginPath();x.moveTo(290,40);x.lineTo(290,520);x.moveTo(50,280);x.lineTo(530,280);x.stroke();x.strokeStyle='#e9505b';x.lineWidth=9;x.beginPath();x.moveTo(...S);for(let j=0;j<q.i;j++)x.lineTo(...P[j]);x.stroke();x.font='26px sans-serif';x.textAlign='center';x.fillText('⭐',...S);x.fillText('△',...E);P.forEach((p,j)=>{x.beginPath();x.fillStyle=j<q.i?'#6db55b':j==q.i?'#ffd55a':'#fff';x.arc(...p,20,0,7);x.fill();x.stroke();x.fillStyle='#173047';x.font='bold 14px sans-serif';x.fillText(j+1,p[0],p[1]+5)})}function ui(){count.textContent='已完成 '+q.i+' / 30';next.innerHTML=q.i==30?'完成！':'請 <b>'+(q.i+1)+' 號</b>：從 '+(q.i?'第 '+q.i+' 點':'⭐')+' 拖到 '+(q.i+1);n.innerHTML='';for(let j=1;j<31;j++){let b=document.createElement('button');b.textContent=j;b.className=j<=q.i?'ok':j==q.i+1?'now':'';b.onclick=()=>m.textContent=j==q.i+1?'請開始畫線。':'現在輪到 '+(q.i+1)+' 號。';n.appendChild(b)}}function p(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*560/r.height]}c.onpointerdown=e=>{let a=p(e),o=q.i?P[q.i-1]:S;if(d(a,o)<35){q.on=1}else m.textContent='請從前一點開始。'};c.onpointerup=e=>{if(!q.on)return;q.on=0;if(d(p(e),P[q.i])<35){q.i++;m.textContent='✓ 完成！請下一位。';if(q.i==30)win.hidden=false}else m.textContent='請再試一次。';draw();ui()};u.onclick=()=>{if(q.i)q.i--;win.hidden=true;draw();ui()};r.onclick=()=>{q.i=0;win.hidden=true;draw();ui()};draw();ui();</script>
